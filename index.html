<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Insights - Get Started</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="index">

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-brand">🌿 Fitness Insights</a>
    <h1 id="form-title">Tell Us About Yourself</h1>
    <p style="text-align:center;color:var(--color-text-muted);margin-top:-8px;">We'll use this to build your personalized fitness plan.</p>

    <form id="fitness-form" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Jordan Lee" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="height">Height (cm)</label>
          <input type="number" id="height" name="height" min="100" max="250" placeholder="175" required>
        </div>
        <div class="form-group">
          <label for="weight">Weight (kg)</label>
          <input type="number" id="weight" name="weight" min="30" max="300" placeholder="70" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="10" max="100" placeholder="28" required>
        </div>
        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="" disabled selected>Select...</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="goal">Fitness Goal</label>
        <select id="goal" name="goal" required>
          <option value="" disabled selected>Select...</option>
          <option value="lose-weight">Lose Weight</option>
          <option value="gain-muscle">Gain Muscle</option>
          <option value="maintain">Maintain Weight</option>
          <option value="endurance">Improve Endurance</option>
        </select>
      </div>

      <div class="form-group">
        <label for="activityLevel">Activity Level</label>
        <select id="activityLevel" name="activityLevel" required>
          <option value="" disabled selected>Select...</option>
          <option value="sedentary">Sedentary (little or no exercise)</option>
          <option value="light">Lightly Active (1-3 days/week)</option>
          <option value="moderate">Moderately Active (3-5 days/week)</option>
          <option value="active">Active (6-7 days/week)</option>
          <option value="very-active">Very Active (hard exercise daily)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Get My Plan</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/bmi.js"></script>
<script src="js/recommendation.js"></script>
<script src="js/app.js"></script>
<script src="logo.js"></script>
</body>
</html>
