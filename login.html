<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Insights - Log In</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-brand">🌿 Fitness Insights</a>
    <h1>Welcome Back</h1>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
      </div>
      <p class="form-error hidden" id="login-error"></p>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <div class="auth-divider">or</div>
    <button type="button" class="btn btn-outline btn-block" id="show-register-btn">Create Account</button>

    <div class="hidden" id="inline-register-section" style="margin-top:24px;">
      <h1 style="font-size:1.2rem;">Create Your Account</h1>
      <form id="inline-register-form" novalidate>
        <div class="form-group">
          <label for="reg-fullname">Full Name</label>
          <input type="text" id="reg-fullname" name="fullName" placeholder="Jordan Lee" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" name="password" minlength="6" placeholder="At least 6 characters" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="logo.js"></script>
</body>
</html>
