<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Insights - Create Account</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">

<div class="auth-shell">
  <div class="auth-card">
    <a href="login.html" class="auth-brand">🌿 Fitness Insights</a>
    <h1>Create Your Account</h1>
    <p style="text-align:center;color:var(--color-text-muted);margin-top:-8px;">Standalone sign-up page.</p>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Jordan Lee" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" placeholder="At least 6 characters" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="js/app.js"></script>
<script src="logo.js"></script>
</body>
</html>
